# Homelab toolchain — pinned so every operator (and every agent) uses the
# same versions. Renovate's `mise` manager bumps these.
#
# kubectl tracks the k3s server minor (v1.35.x) — see GITOPS.md "Known gaps".

[tools]
kubectl = "1.35.8"
flux2 = "2.9.5"
helm = "4.3.0"
sops = "3.13.3"
age = "1.3.2"
# Cloud secrets backend. age/sops stay for the in-repo bootstrap layer.
infisical = "0.43.133"
# Resolves image tag -> digest when pinning; see README "Images".
crane = "0.22.1"
# Hypervisor + Cloudflare layer (GITOPS.md Phase 6). Runs from this VM by
# hand -- deliberately NOT reconciled by Flux, see "Scope: Flux manages the
# cluster, not the hypervisor".
opentofu = "1.12.6"
# ESPHome firmware for the voice satellite (VOICE.md V3). Compiled and flashed
# from this VM; uv is the installer mise's pipx backend uses when present.
uv = "0.12.17"
"pipx:esphome" = "2026.9.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
