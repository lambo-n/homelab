; llama-server router presets. Installed to /etc/llama/models.ini.
; See homelab GPU-VM.md F4 (measurements) and F5. VRAM: 31.89 GiB.
; llama-fast.service (Qwen3.5-4B, -c 8192) is normally loaded beside these.
version = 1

[*]
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; explicit sizes below; fail loudly rather than shrink context or offload layers
fit = off
parallel = 1

; Everyday coding, beside fast. F4d measured 2 x 40,960 here; one slot of 81,920
; holds the same KV and less recurrent state.
[qwen27]
model = /models/gguf/Qwen3.8-27B-UD-Q6_K_XL.gguf
ctx-size = 81920

; Long agent runs and architecture work. Needs the card to itself:
; run `sudo llm-mode agent` first (stops llama-fast). F4c measured 195,072.
[qwen27-agent]
model = /models/gguf/Qwen3.8-27B-UD-Q6_K_XL.gguf
ctx-size = 195072

; General chat, beside fast. Context not measured yet: fit picks it on the
; first load (F5 step 5); then pin ctx-size here and delete `fit = on`.
[chat]
model = /models/gguf/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
fit = on
