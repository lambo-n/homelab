; llama-server router presets. Installed to /etc/llama/models.ini.
; See homelab GPU-VM.md F4 (measurements) and F5. VRAM: 31.89 GiB.
; llama-fast.service (Qwen3.5-4B, -c 8192) is normally loaded beside these.
version = 1

[*]
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; explicit sizes below; fail loudly rather than shrink context or offload layers
fit = off
parallel = 1
; Sampling defaults from the Qwen model cards, thinking mode (llama.cpp's own
; defaults differ: temp 0.8, top-k 40, min-p 0.05). Requests can override.
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0

; Everyday coding, beside fast. F4d measured 2 x 40,960 here; one slot of 81,920
; holds the same KV and less recurrent state.
[qwen27]
model = /models/gguf/Qwen3.8-27B-UD-Q6_K_XL.gguf
; GGUF template with one fix: mid-conversation system messages render instead of
; raising (Claude Code sends them). scripts/llm/templates/, GPU-VM.md F6d.
chat-template-file = /etc/llama/templates/qwen3.8-27b.jinja
ctx-size = 81920

; Long agent runs and architecture work. Needs the card to itself:
; run `sudo llm-mode agent` first (stops llama-fast). F4c measured 195,072.
[qwen27-agent]
model = /models/gguf/Qwen3.8-27B-UD-Q6_K_XL.gguf
; GGUF template with one fix: mid-conversation system messages render instead of
; raising (Claude Code sends them). scripts/llm/templates/, GPU-VM.md F6d.
chat-template-file = /etc/llama/templates/qwen3.8-27b.jinja
ctx-size = 195072

; General chat, beside fast. F5d: fit chose the model's full 262,144 context
; beside fast (hybrid attention keeps the KV small), so pinned at that.
[chat]
model = /models/gguf/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
ctx-size = 262144
; Qwen3.6 card, thinking mode for general tasks. The Qwen3.8-27B presets keep 0.
presence-penalty = 1.5
