# Voice satellite: Waveshare ESP32-S3-Touch-LCD-1.85C-BOX.
#
# LEAN BY DESIGN (VOICE.md V3). ESPHome warns that audio components crash
# devices that carry too much else, Bluetooth above all. So this device does
# exactly four things: capture audio, spot the wake word, stream to Home
# Assistant, play the reply. Everything else runs on the cluster or VM 105.
#
#   NO  esp32_ble / bluetooth_proxy / BLE improv -- the named crash source
#   NO  media_player      -- `speaker:` below; HA streams already-decoded PCM
#   NO  display / LVGL    -- deferred to V5, added only once V3's heap numbers
#                            show room (the frame buffers are the largest cost)
#   NO  web_server, captive_portal, verbose logging
#
# Pin map: first from ulsmith/home-assistant-esphome-esp32-s3-touch-lcd-185c
# @ db184c07; its audio pins were wrong for this board and the audio section
# now follows Waveshare's official examples (see i2s_audio below). That config streams audio to
# HA continuously for server-side wake word; this one does NOT -- the wake word
# runs on the device and the mic reaches the network only after it fires.
#
# Build/flash only through scripts/esphome-run.sh, which decrypts
# secrets.sops.yaml into a tmpfs directory for the length of one run.

esphome:
  name: voice-satellite
  friendly_name: Voice Satellite
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - speaker.volume_set:
          id: spk
          volume: !lambda return id(speaker_volume).state / 100.0f;
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# ESP32-S3R8: 8 MB octal PSRAM. Audio buffers and the wake-word task stack go
# here so internal RAM -- what Wi-Fi and the API need -- stays free.
psram:
  mode: octal
  speed: 80MHz

logger:
  # TEMPORARY (2026-09-19): DEBUG while diagnosing no wake word models and a
  # silent mic. Back to WARN once both are fixed.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # HA dials this device; if HA (the cluster) is off, do not reboot-loop
  # waiting for it. 0s disables the reboot.
  reboot_timeout: 0s
  on_client_connected:
    - micro_wake_word.start:

ota:
  - platform: esphome
    # Bare `encryption:` inherits the api key above: uploads must hold it, and
    # there is no separate OTA password to leak or rotate (ESPHome 2026.9
    # flags a password as wasted flash and RAM when api encryption exists).
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No AP fallback: that pulls in captive_portal, and a satellite that cannot
  # join Wi-Fi is fixed over USB anyway.
  ap: !remove

# Audio wiring from Waveshare's own code for this board
# (waveshareteam/ESP32-S3-Touch-LCD-1.85C, Arduino examples 03_audio_out and
# 08_esp_sr), NOT the community config the pins first came from: that one drove
# GPIO2 (really MCLK) and GPIO15 (really the amp enable) as mic clocks, and the
# mic read all-zero samples (-inf dB) on both channels (2026-09-19).
#
# One I2S bus shared by both chips: the ES7210 ADC digitises the two analog
# mics, the ES8311 codec drives the speaker. Both need MCLK and an I2C setup,
# which the audio_adc / audio_dac components below do at boot. Mic and speaker
# take turns on the bus (ESPHome locks it), which suits this device: the wake
# word stops after detection and restarts in voice_assistant.on_end.
i2c:
  sda: GPIO11
  scl: GPIO10
  # TEMPORARY (2026-09-19): log the bus at boot. Expect touch 0x15, PCA9554
  # 0x20, ES8311 0x18, ES7210 0x40 (RTC too). Remove with the DEBUG logger.
  scan: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    # Waveshare's speech-recognition example uses 36 dB.
    mic_gain: 36db

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    # The ES7210 puts mic 1 on the left slot, mic 2 on the right.
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit

# Speaker amplifier enable. Waveshare's audio example drives it HIGH before
# playing; nothing else uses the pin.
switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO15
    restore_mode: ALWAYS_ON
    internal: true

# Output volume, set through the ES8311. The speaker defaults to full scale,
# which is far too loud in a room (2026-09-19). A slider in HA, kept across
# reboots and applied at boot.
number:
  - platform: template
    id: speaker_volume
    name: Speaker Volume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: slider
    on_value:
      - speaker.volume_set:
          id: spk
          volume: !lambda return x / 100.0f;

micro_wake_word:
  id: mww
  microphone: mic
  # Inference task stack in PSRAM, not internal RAM.
  task_stack_in_psram: true
  # One model: the custom "Hey Doofus" (VOICE.md V5), v2 from
  # ~/mww-hey-doofus, sha256 7fbff053...90edb89. It replaces the stock
  # okay_nabu rather than running beside it: each model is a second
  # always-running inference with its own tensor arena (28,000 B here, from
  # TFLite Micro measurement + okay_nabu's manifest margin). Cutoff and window
  # are the manifest's, repeated so a retune is a one-line diff. No VAD model
  # until false accepts show it is needed.
  models:
    - model: wake_words/hey_doofus.json
      id: hey_doofus
      probability_cutoff: 0.97
      sliding_window_size: 5
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  speaker: spk
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  # Wake word runs above, on-device. HA must not run its own.
  use_wake_word: false
  on_end:
    # stop_after_detection defaults to true, so the wake word is stopped for the
    # length of the conversation and restarted here.
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start:
  on_error:
    - micro_wake_word.start:
  on_client_disconnected:
    # Cluster gone mid-conversation: go back to listening for the wake word
    # rather than holding the mic open against nothing.
    - voice_assistant.stop:
    - micro_wake_word.start:

# Side button (GPIO0, BOOT): push-to-talk, and the only way to stop a reply.
binary_sensor:
  - platform: gpio
    id: side_button
    name: Side Button
    pin:
      number: GPIO0
      inverted: true
      # The BOOT strap. Safe as an input: it only matters while reset is held.
      ignore_strapping_warning: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - voice_assistant.start:

# Memory telemetry, the point of V3: add one component at a time and watch
# these. `debug` is a few hundred bytes.
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: Heap Free
    block:
      name: Heap Max Block
    psram:
      name: PSRAM Free
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  # TEMPORARY diagnostic (2026-09-19): mic loudness, to tell a silent mic from
  # a wake word problem. Passive: it reads only while the wake word (or a
  # conversation) holds the mic, so it never keeps the shared I2S bus from
  # the speaker.
  - platform: sound_level
    passive: true
    measurement_duration: 1s
    peak:
      name: Mic Peak
    rms:
      name: Mic RMS
