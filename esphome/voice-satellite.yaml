# Voice satellite: Waveshare ESP32-S3-Touch-LCD-1.85C-BOX.
#
# LEAN BY DESIGN (VOICE.md V3). ESPHome warns that audio components crash
# devices that carry too much else, Bluetooth above all. So this device does
# exactly four things: capture audio, spot the wake word, stream to Home
# Assistant, play the reply. Everything else runs on the cluster or VM 105.
#
#   NO  esp32_ble / bluetooth_proxy / BLE improv -- the named crash source
#   NO  media_player      -- `speaker:` below; HA streams already-decoded PCM
#   NO  LVGL              -- the display (V5) is one lambda drawing a state
#                            face; its frame buffer lives in PSRAM
#   NO  web_server, captive_portal, verbose logging
#
# Pin map: first from ulsmith/home-assistant-esphome-esp32-s3-touch-lcd-185c
# @ db184c07; its audio pins were wrong for this board and the audio section
# now follows Waveshare's official examples (see i2s_audio below). That config streams audio to
# HA continuously for server-side wake word; this one does NOT -- the wake word
# runs on the device and the mic reaches the network only after it fires.
#
# Build/flash only through scripts/esphome-run.sh, which decrypts
# secrets.sops.yaml into a tmpfs directory for the length of one run.

esphome:
  name: voice-satellite
  friendly_name: Voice Satellite
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - speaker.volume_set:
          id: spk
          volume: !lambda return id(speaker_volume).state / 100.0f;
      - script.execute: resume_wake_word

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# ESP32-S3R8: 8 MB octal PSRAM. Audio buffers and the wake-word task stack go
# here so internal RAM -- what Wi-Fi and the API need -- stays free.
psram:
  mode: octal
  speed: 80MHz

logger:
  # TEMPORARY (2026-09-19): DEBUG to trace the speaker left retrying "Parent
  # bus is busy" after replies. Back to WARN once understood.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # HA dials this device; if HA (the cluster) is off, do not reboot-loop
  # waiting for it. 0s disables the reboot.
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: resume_wake_word

ota:
  - platform: esphome
    # Bare `encryption:` inherits the api key above: uploads must hold it, and
    # there is no separate OTA password to leak or rotate (ESPHome 2026.9
    # flags a password as wasted flash and RAM when api encryption exists).
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No AP fallback: that pulls in captive_portal, and a satellite that cannot
  # join Wi-Fi is fixed over USB anyway.
  ap: !remove

# Audio wiring from Waveshare's own code for this board
# (waveshareteam/ESP32-S3-Touch-LCD-1.85C, Arduino examples 03_audio_out and
# 08_esp_sr), NOT the community config the pins first came from: that one drove
# GPIO2 (really MCLK) and GPIO15 (really the amp enable) as mic clocks, and the
# mic read all-zero samples (-inf dB) on both channels (2026-09-19).
#
# One I2S bus shared by both chips: the ES7210 ADC digitises the two analog
# mics, the ES8311 codec drives the speaker. Both need MCLK and an I2C setup,
# which the audio_adc / audio_dac components below do at boot. Mic and speaker
# take turns on the bus (ESPHome locks it), which suits this device: the wake
# word stops after detection and restarts in voice_assistant.on_end.
i2c:
  sda: GPIO11
  scl: GPIO10
  # Bus scan 2026-09-19: ES8311 0x18, PCA9554 0x20, ES7210 0x40, RTC 0x51.
  scan: false

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    # Waveshare's speech-recognition example uses 36 dB.
    mic_gain: 36db

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    # The ES7210 puts mic 1 on the left slot, mic 2 on the right.
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit

# Speaker amplifier enable. Waveshare's audio example drives it HIGH before
# playing; nothing else uses the pin.
switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO15
    restore_mode: ALWAYS_ON
    internal: true
  # Mic mute: long press on the screen, or from HA. Stops the wake word and any
  # conversation; a dim red ring stays on screen while muted. Software only --
  # the mic keeps power -- and off again after a reboot.
  - platform: template
    id: mic_mute
    name: Mic Mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(muted) = true;
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - script.execute:
          id: set_ui
          state: 0
    turn_off_action:
      # Also runs at boot (ALWAYS_OFF), when there is nothing to undo; on_boot
      # starts the wake word then.
      - if:
          condition:
            lambda: return id(muted);
          then:
            - lambda: id(muted) = false;
            - micro_wake_word.start:
            - script.execute:
                id: set_ui
                state: 0

# Output volume, set through the ES8311. The speaker defaults to full scale,
# which is far too loud in a room (2026-09-19). A slider in HA, kept across
# reboots and applied at boot.
number:
  - platform: template
    id: speaker_volume
    name: Speaker Volume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: slider
    on_value:
      - speaker.volume_set:
          id: spk
          volume: !lambda return x / 100.0f;

# ---------------------------------------------------------------------------
# Display (V5): a state face. Dark and backlight off while idle; a
# filled circle while listening (pulsing gently while HA thinks); the circle
# plus a ring of bars around it while the reply plays.
#
# The bars are ANIMATED, not audio-reactive: ESPHome's speaker exposes only a
# frames-played callback, not the samples, so a true level meter would need a
# custom component.
#
# Speaking and "done" follow the SPEAKER, not voice_assistant events: HA's TTS
# events can arrive after the reply has already played (2026-09-19, the
# screen stayed lit and the bars came back). The interval below shows the bars
# only while the speaker is actually running, and goes dark once it has been
# quiet for 1 s with the assistant idle, or 30 s after the last activity.
#
# Panel: ST77916, 360x360 QSPI. ESPHome's built-in ESP-VOCAT model carries the
# same 181-command init sequence as Waveshare's 01_lvgl_example (compared
# 2026-09-19); only the pins differ, and they come from that example: SCK 40,
# data 46/45/42/41, CS 21, reset on the PCA9554's EXIO2, backlight GPIO5.
# ---------------------------------------------------------------------------
globals:
  # 0 idle, 1 listening, 2 thinking, 3 speaking.
  - id: ui_state
    type: int
    initial_value: "0"
  # millis() of the last state change and of the last moment audio played.
  - id: ui_changed_at
    type: uint32_t
    initial_value: "0"
  - id: ui_audio_at
    type: uint32_t
    initial_value: "0"
  # millis() when the current touch began; tap vs long press on release.
  - id: touch_at
    type: uint32_t
    initial_value: "0"
  # Mic Mute's real state. The template switch publishes only after its
  # actions run, so they cannot read the switch itself.
  - id: muted
    type: bool
    initial_value: "false"

pca9554:
  - id: exio
    address: 0x20

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO40
    data_pins: [GPIO46, GPIO45, GPIO42, GPIO41]

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO5

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 200ms
    internal: true

display:
  - platform: mipi_spi
    id: screen
    model: ESP-VOCAT
    spi_id: display_qspi
    cs_pin: GPIO21
    reset_pin:
      pca9554: exio
      number: 2
    # Redrawn on state changes and, while animating, by the interval below.
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      const int cx = 180, cy = 180;
      const Color accent(0, 180, 216);
      static float level[48] = {0};
      it.fill(Color::BLACK);
      const int state = id(ui_state);
      if (state == 0) {
        if (id(muted)) {
          for (int r = 170; r < 178; r++) it.circle(cx, cy, r, Color(200, 0, 0));
        }
        return;
      }
      const float t = millis() / 1000.0f;
      // Thinking: the circle breathes. Otherwise it holds still.
      const int r = state == 2 ? 92 + (int) (6.0f * sinf(t * 4.0f)) : 92;
      it.filled_circle(cx, cy, r, accent);
      if (state != 3) {
        for (auto &l : level) l = 0.0f;
        return;
      }
      // Speaking: 48 bars around the circle. Two drifting sine waves plus a
      // little noise give each bar a target; bars ease towards it.
      const float step = 2.0f * M_PI / 48.0f, half = 0.045f;
      for (int i = 0; i < 48; i++) {
        float target = 0.5f + 0.5f * sinf(t * 7.0f + i * 0.9f) * sinf(t * 3.1f - i * 0.37f);
        target *= 0.6f + 0.4f * random_float();
        level[i] += (target - level[i]) * 0.35f;
        const float r0 = 106.0f, r1 = r0 + 8.0f + 62.0f * level[i];
        const float a = i * step;
        const float c0 = cosf(a - half), s0 = sinf(a - half);
        const float c1 = cosf(a + half), s1 = sinf(a + half);
        const int x0 = cx + r0 * c0, y0 = cy + r0 * s0, x1 = cx + r0 * c1, y1 = cy + r0 * s1;
        const int x2 = cx + r1 * c1, y2 = cy + r1 * s1, x3 = cx + r1 * c0, y3 = cy + r1 * s0;
        it.filled_triangle(x0, y0, x1, y1, x2, y2, accent);
        it.filled_triangle(x0, y0, x2, y2, x3, y3, accent);
      }

# Touch: CST816 at 0x15 on the shared I2C bus, IRQ on GPIO4, reset on the
# PCA9554's EXIO1 (Waveshare 01_lvgl_example). The expander powers up with
# EXIO1 low, which holds the chip in reset -- why the 2026-09-19 bus scan under
# this firmware missed it, though the factory demo (which releases it) had
# working touch.
#
#   tap           idle: talk (as the side button); conversation: stop it
#   press >= 0.8s toggle Mic Mute
#
# Any tap is ignored while muted; only the long press unmutes.
touchscreen:
  - platform: cst816
    id: touch
    display: screen
    # Waveshare waits 50 ms after reset before talking to the chip; ESPHome
    # waits 30 ms, and the probe then failed ("Failed to read chip ID",
    # 2026-09-19). Read a minute after boot, the chip answers 0xB5 (CST816T),
    # so it is only the timing: skip the probe.
    skip_probe: true
    interrupt_pin:
      number: GPIO4
      # Open-drain IRQ; Waveshare's example sets INPUT_PULLUP.
      mode:
        input: true
        pullup: true
    reset_pin:
      pca9554: exio
      number: 1
    on_touch:
      - lambda: |-
          id(touch_at) = millis();
          ESP_LOGI("touch", "touch x=%d y=%d", touch.x, touch.y);
    on_release:
      - if:
          condition:
            lambda: return millis() - id(touch_at) >= 800;
          then:
            - switch.toggle: mic_mute
          else:
            - if:
                condition:
                  switch.is_on: mic_mute
                then:
                  - logger.log: "tap ignored while muted"
                else:
                  - if:
                      condition: voice_assistant.is_running
                      then:
                        - voice_assistant.stop:
                      else:
                        - voice_assistant.start:

script:
  # Restarts the wake word after a conversation or reconnect, unless muted.
  - id: resume_wake_word
    then:
      - if:
          condition:
            lambda: return !id(muted);
          then:
            - micro_wake_word.start:

  # Every state change goes through here: store it, redraw, and switch the
  # backlight (off when idle so the screen is dark, not a lit black panel).
  - id: set_ui
    mode: queued
    parameters:
      state: int
    then:
      - lambda: |-
          if (id(ui_state) != state) ESP_LOGI("ui", "state %d -> %d", id(ui_state), state);
          id(ui_state) = state;
          id(ui_changed_at) = millis();
      - component.update: screen
      - if:
          condition:
            lambda: return state == 0 && !id(muted);
          then:
            - light.turn_off: backlight
          else:
            # Dim while idle and muted (just the red ring), bright otherwise.
            - light.turn_on:
                id: backlight
                brightness: !lambda "return state == 0 ? 0.2f : 0.8f;"

interval:
  # ~20 fps. Drives speaking/done from the speaker's real state, then redraws
  # while something moves (thinking pulse, speaking bars).
  - interval: 50ms
    then:
      - lambda: |-
          const int state = id(ui_state);
          if (state == 0) return;
          const uint32_t now = millis();
          if (id(spk).is_running()) {
            id(ui_audio_at) = now;
            if (state == 2) id(set_ui)->execute(3);
            return;
          }
          const bool quiet = now - id(ui_audio_at) > 1000;
          if (state == 3 && quiet && !id(va).is_running()) {
            id(set_ui)->execute(0);
          } else if (now - id(ui_changed_at) > 30000 && now - id(ui_audio_at) > 30000) {
            id(set_ui)->execute(0);
          }
      - if:
          condition:
            lambda: return id(ui_state) >= 2;
          then:
            - component.update: screen

micro_wake_word:
  id: mww
  microphone: mic
  # Inference task stack in PSRAM, not internal RAM.
  task_stack_in_psram: true
  # One model: the custom "Hey Doofus" (VOICE.md V5), v2 from
  # ~/mww-hey-doofus, sha256 7fbff053...90edb89. It replaces the stock
  # okay_nabu rather than running beside it: each model is a second
  # always-running inference with its own tensor arena (28,000 B here, from
  # TFLite Micro measurement + okay_nabu's manifest margin). Cutoff and window
  # are the manifest's, repeated so a retune is a one-line diff. No VAD model
  # until false accepts show it is needed.
  models:
    - model: wake_words/hey_doofus.json
      id: hey_doofus
      probability_cutoff: 0.97
      sliding_window_size: 5
  on_wake_word_detected:
    - script.execute:
        id: set_ui
        state: 1
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  speaker: spk
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  # Wake word runs above, on-device. HA must not run its own.
  use_wake_word: false
  # Display states (the push-to-talk button lands in on_listening too).
  on_listening:
    - script.execute:
        id: set_ui
        state: 1
  on_stt_vad_end:
    - script.execute:
        id: set_ui
        state: 2
  on_idle:
    - script.execute:
        id: set_ui
        state: 0
  on_end:
    # stop_after_detection defaults to true, so the wake word is stopped for the
    # length of the conversation and restarted here.
    - wait_until:
        not:
          voice_assistant.is_running:
    - script.execute: resume_wake_word
    - script.execute:
        id: set_ui
        state: 0
  on_error:
    - script.execute: resume_wake_word
    - script.execute:
        id: set_ui
        state: 0
  on_client_disconnected:
    # Cluster gone mid-conversation: go back to listening for the wake word
    # rather than holding the mic open against nothing.
    - voice_assistant.stop:
    - script.execute: resume_wake_word
    - script.execute:
        id: set_ui
        state: 0

# Side button (GPIO0, BOOT): push-to-talk, and the only way to stop a reply.
binary_sensor:
  - platform: gpio
    id: side_button
    name: Side Button
    pin:
      number: GPIO0
      inverted: true
      # The BOOT strap. Safe as an input: it only matters while reset is held.
      ignore_strapping_warning: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - voice_assistant.start:

# Memory telemetry, the point of V3: add one component at a time and watch
# these. `debug` is a few hundred bytes.
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: Heap Free
    block:
      name: Heap Max Block
    psram:
      name: PSRAM Free
    # Lowest free heap since boot: catches the trough during a reply, which a
    # 30 s sample of Heap Free would usually miss.
    min_free:
      name: Heap Min Free
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
