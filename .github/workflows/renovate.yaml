name: Renovate

on:
  # Once daily at 10:00 UTC (3 am US Pacific Daylight / 2 am PST).
  # Renovate opens/updates PRs and automerges the ones that match the rules
  # in .renovate/autoMerge.json5.
  schedule:
    - cron: "0 10 * * *"
  # Run on demand, with optional dry-run / log-level for debugging.
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log only — no branches, PRs, or merges)"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info
  # React quickly when the Renovate config or this workflow changes.
  push:
    branches: [main]
    paths:
      # renovate.json* (not just .json5) so a stray config file — which would
      # silently shadow .renovaterc.json5 — trips a run instead of going unnoticed.
      - .renovaterc*
      - renovate.json*
      - .renovate/**
      - .github/workflows/renovate.yaml

# Never let two Renovate runs touch the repo at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Minimal default token; all write access comes from the GitHub App token below.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token from the GitHub App. Renovate acts as the App
      # (not as a PAT tied to a person), so its commits/PRs/merges are clearly
      # attributable and the App's permissions can be tightly scoped.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Look up the App's bot user id so commits are authored by the bot account
      # and pass branch-protection "verified author" style checks cleanly.
      - name: Resolve App user id
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          # The action's own default, with LOG_LEVEL widened to LOG_\w+ so the
          # LOG_FILE* vars below reach the container. Everything else verbatim.
          env-regex: '^(?:RENOVATE_\w+|LOG_\w+|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          # Single-repo run — no org-wide autodiscovery.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Author commits as the GitHub App's bot identity.
          RENOVATE_USERNAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          RENOVATE_GIT_AUTHOR: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          # Honour the workflow_dispatch inputs (unset on scheduled/push runs).
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Mirror the run to a file the next step can inspect. The action
          # bind-mounts /tmp into the container (docker-volumes defaults to
          # /tmp:/tmp), so this lands on the runner. Always debug regardless of
          # LOG_LEVEL: the stdout log stays readable, the file keeps the detail
          # needed to diagnose a failure. Format is one JSON object per line.
          LOG_FILE: /tmp/renovate-log.ndjson
          LOG_FILE_LEVEL: debug

      # Renovate exits 0 even when a repository aborts mid-run -- a 403 surfaces
      # only as "Integration unauthorized" at WARN level -- and even when the
      # process crashes after the container starts. A green check therefore says
      # nothing about whether anything was updated, which is how a missing
      # "Commit statuses" App permission went unnoticed from 2026-09-03 to 09-08
      # while every scheduled run reported success. Read the outcome out of the
      # log and fail loudly instead.
      - name: Check Renovate result
        if: always()
        run: |
          set -euo pipefail
          log=/tmp/renovate-log.ndjson

          if [[ ! -s "${log}" ]]; then
            echo "::error::Renovate wrote no log file -- it failed before logging began."
            exit 1
          fi

          status=0

          # Bunyan levels: 50 = error, 60 = fatal. Catches things like the
          # ERR_MODULE_NOT_FOUND crash a broken upstream image caused on 09-04.
          jq -c 'select(.level >= 50)' "${log}" > /tmp/renovate-errors.ndjson || true
          if [[ -s /tmp/renovate-errors.ndjson ]]; then
            echo "::error::Renovate logged error-level events:"
            jq -r '"  \(.msg) \(.err.message // .err.code // "")"' /tmp/renovate-errors.ndjson
            status=1
          fi

          # Every repository must reach a healthy terminal result. Anything else
          # -- integration-unauthorized, rate-limited, lookup-failure -- means the
          # run stopped early and the remaining dependencies went unevaluated.
          mapfile -t results < <(jq -r 'select(.msg == "Repository finished") | .result' "${log}")
          if [[ ${#results[@]} -eq 0 ]]; then
            echo "::error::Renovate never reached 'Repository finished' -- the run was cut short."
            status=1
          fi
          for result in ${results[@]+"${results[@]}"}; do
            case "${result}" in
              done|automerged|onboarding)
                echo "Repository finished: ${result}"
                ;;
              *)
                echo "::error::Renovate aborted with result '${result}'"
                status=1
                ;;
            esac
          done

          # On failure, replay the warnings so the cause is visible here rather
          # than only in the discarded debug log.
          if [[ ${status} -ne 0 ]]; then
            echo "--- warn-and-above records ---"
            jq -r 'select(.level >= 40) | "  \(.msg)"' "${log}" | tail -50
          fi

          exit ${status}
