name: Validate manifests

# Builds every Kustomization in the repo. This is the pre-merge gate that
# Renovate automerge waits on -- before it existed, the only check here was
# GitGuardian secret scanning, which is PR-only (verified 2026-09-08: it posts a
# check on a PR head but not on a push to main), so a dependency bump could
# reach the cluster with nothing having read the manifests it changed.
#
# **No `paths:` filter, deliberately.** Every push to a `renovate/**` branch must
# produce a check. Filtering by path would leave a branch that touches only
# mise.toml, tofu/ or .github/ with *no* check at all, and how Renovate reads a
# commit carrying zero checks is not something to bet on -- green means it merges
# unvalidated, yellow means it silently never merges. Neither is acceptable, and
# a 12s run on every push is cheaper than finding out which. Same reasoning for
# `pull_request`: an update that touches no manifests still needs a green check to
# merge. GitHub Actions cannot scope `paths` per branch anyway.
#
# The `renovate/**` push trigger stays even though automerge now uses
# `automergeType: pr`: Renovate pushes the branch before it opens the PR, and this
# way the check exists regardless of whether a PR is ever created.
#
# Two jobs, because they fail for different reasons. `kustomize build` is offline
# and proves the manifests are well-formed. `helm template` reaches ghcr.io and
# dl.cloudsmith.io and proves the pinned chart version exists, pulls, and renders
# against our values -- the half a Renovate chart bump changes, and the half
# kustomize cannot see: a HelmRelease points at an OCIRepository tag, so a bad
# bump is one valid-looking string.
#
# Neither job talks to the cluster. A chart that renders here can still fail to
# apply; reconcile-time healthChecks remain the last gate. See GITOPS.md "Renovate".

on:
  pull_request:
  push:
    branches:
      - main
      - renovate/**
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Superseded runs are cancelled: Renovate force-pushes its
# branches on rebase, and only the newest commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize-build:
    name: kustomize build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reuses mise.toml, so CI builds with the same kubectl the operator runs
      # -- the version skew this repo pins tools to avoid. kubectl embeds
      # kustomize, so nothing else needs installing.
      - name: Install pinned kubectl
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: kubectl
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Build every Kustomization
        run: |
          set -euo pipefail
          fail=0

          # SOPS files need no decryption to build: the ciphertext sits in
          # values, and apiVersion/kind/metadata stay in plaintext, which is
          # all kustomize reads. CI therefore needs no age key.
          while IFS= read -r dir; do
            if out="$(kubectl kustomize "${dir}" 2>&1)"; then
              count="$(printf '%s\n' "${out}" | grep -c '^kind:' || true)"
              printf 'ok    %-58s %s resources\n' "${dir}" "${count}"
            else
              printf '::error::kustomize build failed: %s\n' "${dir}"
              printf '%s\n' "${out}" | sed 's/^/    /'
              fail=1
            fi
          done < <(find kubernetes -name kustomization.yaml -printf '%h\n' | sort)

          exit "${fail}"

      - name: Check Flux Kustomization paths resolve
        run: |
          set -euo pipefail
          fail=0

          # A ks.yaml spec.path that does not exist is invisible to kustomize
          # build -- Flux only reports it at reconcile time, as a failed
          # Kustomization that then blocks anything depending on it.
          while IFS= read -r ks; do
            while IFS= read -r path; do
              path="${path#./}"
              if [[ ! -d "${path}" ]]; then
                printf '::error file=%s::spec.path does not exist: %s\n' "${ks}" "${path}"
                fail=1
              fi
            done < <(sed -n 's/^[[:space:]]*path:[[:space:]]*//p' "${ks}")
          done < <(find kubernetes -name ks.yaml | sort)

          exit "${fail}"

  helm-template:
    name: helm template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # helm 4.2.4 from mise.toml -- the same pin the operator uses by hand.
      - name: Install pinned helm
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Ensure PyYAML
        run: |
          set -euo pipefail
          # Present on GitHub's runner images today; installed rather than
          # assumed so this job does not start failing on an image change.
          python3 -c 'import yaml' 2>/dev/null && exit 0
          # renovate: datasource=pypi depName=pyyaml
          pip install --quiet --disable-pip-version-check 'pyyaml==6.0.3'

      - name: Render every HelmRelease
        run: python3 .github/scripts/render-charts.py kubernetes
