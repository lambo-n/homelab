apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Root sync target. The FluxInstance points its GitRepository sync here; every
# app Kustomization is reached from this one file.
#
# Order here is cosmetic -- Flux resolves real ordering through dependsOn on
# the Kustomizations themselves, not through this list.
resources:
  - ../../apps/cert-manager
  - ../../apps/cnpg-system
  - ../../apps/infisical
  - ../../apps/observability
  - ../../apps/reloader
  - ../../apps/sunfire
  # TEMPORARY -- break-glass subnet router, added 2026-09-09 after `pct stop
  # 100` removed the only tailnet member. Remove this line and the directory it
  # points at once CTID 100 is running again.
  - ../../apps/tailscale-recovery
