---
# Barman Cloud as a CNPG-I plugin. This is not an optional add-on: CNPG removed
# the in-tree `spec.backup.barmanObjectStore` in 1.28 and this cluster runs
# 1.30, so the plugin is the only way to back the database up at all.
#
# MUST be installed in the operator's own namespace -- the operator discovers
# plugins by looking for their Service in the namespace it runs in, so moving
# this elsewhere makes it silently invisible rather than broken.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # No `crds:` policy here, and that is deliberate -- do not copy the
  # `crds: CreateReplace` from kube-prometheus-stack's HelmRelease. Flux's crds
  # policy governs only a chart's top-level `crds/` directory, which Helm installs
  # once and never upgrades. This chart has no such directory: it ships the
  # ObjectStore CRD as an ordinary template at `templates/crds/crds.yaml`, gated on
  # `.Values.crds.create` (default true), in both 0.7.1 and 0.8.0 -- verified by
  # pulling both charts from ghcr on 2026-09-08. A templated CRD is part of the
  # release manifest, so Helm upgrades it like anything else and the policy would
  # be a no-op. The CRD also carries `helm.sh/resource-policy: keep`, so an
  # uninstall leaves it (and the ObjectStore objects) in place.
  values:
    replicaCount: 1
