---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./kubernetes/apps/cnpg-system/plugin-barman-cloud/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  # Both are hard prerequisites, not preferences: the plugin registers with the
  # operator over mTLS and cert-manager mints that keypair. Starting it early
  # yields a CrashLoop on missing CRDs rather than a useful error.
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: plugin-barman-cloud
      namespace: cnpg-system
