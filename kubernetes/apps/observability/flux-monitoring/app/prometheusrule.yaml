---
# Metric-based half of Flux alerting. The event-based half is in
# notification.yaml -- see the note there for why both exist.
#
# ⚠️ THE ALERT EVERY GUIDE GIVES YOU DOES NOT WORK ON FLUX v2.9.
# Upstream's example, the Flux docs, and every blog post derived from them
# alert on `gotk_reconcile_condition{type="Ready",status="False"}`. That metric
# does not exist here. Verified 2026-09-04 against kustomize-controller's raw
# /metrics: the only gotk_ families it exports are
# gotk_reconcile_duration_seconds, gotk_event_http_* and gotk_token_cache*.
# Neither gotk_reconcile_condition nor gotk_suspend_status is among them, and
# no flag turns them on -- the controllers stopped exporting per-resource
# status gauges.
#
# It fails SILENTLY. A PrometheusRule over a metric that returns no series is
# `health: ok, state: inactive` -- indistinguishable, on every screen
# Prometheus offers, from a cluster where nothing is wrong. That is worth more
# than the usual amount of paranoia: the alert that tells you Flux is broken is
# itself the thing most likely to be quietly broken.
#
# Per-resource status now comes from FLUX-OPERATOR, not from Flux, as
# `flux_resource_info` -- one series per Flux object with `ready`, `suspended`
# and `reason` as labels. Confirmed covering all 8 kinds this cluster uses
# (Kustomization, HelmRelease, GitRepository, OCIRepository, HelmRepository,
# HelmChart, Alert, Provider). A consequence worth naming: these alerts depend
# on flux-operator, which GITOPS.md chose over `flux bootstrap`. Swap the
# install method and this file goes blind -- hence FluxControllerDown below.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-system
  namespace: observability
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: flux-system
      rules:
        # `exported_namespace`, not `namespace`. The PodMonitor scrapes pods, so
        # prometheus-operator attaches the POD's namespace as `namespace`
        # (always flux-system) and the metric's own namespace label is renamed
        # out of the collision. Writing `namespace` here produces a rule that
        # groups every resource in the cluster under one label value.
        - alert: FluxReconciliationFailure
          # `!= "True"` rather than `== "False"`, so a resource wedged in
          # Unknown -- reconciliation started and never finished, which is what
          # a hung Helm upgrade looks like -- is caught too. A resource being
          # deleted drops out of the series entirely, so unlike the old
          # gotk_ expression this needs no guard against alerting on a
          # deliberate `flux delete`.
          expr: flux_resource_info{ready!="True"} == 1
          # 15m, not upstream's 10m. Every Kustomization here reconciles on a
          # 30m interval with a 5m-15m timeout, and cert-manager and
          # kube-prometheus-stack legitimately spend minutes not-Ready on a
          # first install. 15m is past a slow install and well short of a 30m
          # interval, so a genuinely stuck resource still fires before its next
          # attempt.
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has not been Ready for 15 minutes ({{ $labels.reason }})
            description: >-
              Run `flux get all -A --status-selector ready=false` and
              `flux logs --level=error --all-namespaces` on the dev VM.

        - alert: FluxSuspendedResource
          # Suspending is how you stop Flux fighting a manual change. It is also
          # how a resource silently stops being managed after someone forgets to
          # resume it. Info, not warning -- a reminder, not a fault.
          expr: flux_resource_info{suspended="True"} == 1
          for: 12h
          labels:
            severity: info
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has been suspended for 12 hours
            description: >-
              `flux resume {{ $labels.kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}`

        - alert: FluxControllerDown
          # The alert that covers the two above. Every Flux status alert here is
          # built on a metric that VANISHES when its exporter stops, and an
          # expression over an empty vector is inactive, not firing. So if
          # flux-operator dies, FluxReconciliationFailure goes quiet at exactly
          # the moment it is most needed. This fires on the absence instead.
          expr: up{job=~"observability/flux-.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Flux pod {{ $labels.pod }} is not being scraped
            description: >-
              While this is firing, the other Flux alerts cannot fire -- their
              input metrics are gone. Check `kubectl -n flux-system get pods`.
