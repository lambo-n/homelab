---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-vm
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/observability/llm-vm/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    # CRD dependency, same as flux-monitoring: ScrapeConfig and PrometheusRule
    # do not exist as kinds until kube-prometheus-stack registers them.
    - name: kube-prometheus-stack
  # No healthChecks: inert configuration read by the Prometheus operator.
