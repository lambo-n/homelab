---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  # Longer than the 5m the sunfire apps use, for the same reason cert-manager
  # takes 10m: the first install registers the full prometheus-operator CRD set
  # (Prometheus, Alertmanager, ServiceMonitor, PodMonitor, PrometheusRule and
  # friends) and then rolls the operator, two StatefulSets, Grafana and a
  # 3-node node-exporter DaemonSet before the HelmRelease reports Ready.
  timeout: 15m
  path: ./kubernetes/apps/observability/kube-prometheus-stack/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependsOn, same reasoning as reloader: monitoring observes the cluster
  # and nothing in the cluster depends on it. Deliberately outside the sunfire
  # and cnpg graphs so a broken Prometheus cannot wedge the database.
  #
  # cert-manager is NOT a dependency either -- the admission webhook uses the
  # chart's own kube-webhook-certgen job rather than a cert-manager Certificate,
  # so that this stack stays installable even if cert-manager is down. See the
  # HelmRelease.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: observability
