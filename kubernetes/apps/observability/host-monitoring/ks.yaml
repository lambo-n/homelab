---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: host-monitoring
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/observability/host-monitoring/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  dependsOn:
    # CRD dependency, same as llm-vm: ScrapeConfig and PrometheusRule do not
    # exist as kinds until kube-prometheus-stack registers them.
    - name: kube-prometheus-stack
  # No healthChecks: inert configuration read by the Prometheus operator.
