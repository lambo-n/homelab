apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    # Same hazard as the sunfire, cert-manager and reloader namespaces: the
    # parent flux-system Kustomization runs prune: true and this Namespace sits
    # in its inventory, so dropping it from git would delete it and cascade --
    # taking the TSDB PVC with it. Deleting it stays a manual act.
    kustomize.toolkit.fluxcd.io/prune: disabled
