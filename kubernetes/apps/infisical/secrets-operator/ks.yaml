---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-secrets-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/infisical/secrets-operator/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  # No dependsOn, for the same reason as reloader: this controller needs nothing
  # else in the cluster to exist first, and keeping it out of the sunfire graph
  # means a problem here cannot wedge the workloads. The dependency runs the
  # other way -- sunfire-infisical waits on this one, because it applies a CR
  # whose CRD this chart installs.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: secrets-operator
      namespace: infisical
