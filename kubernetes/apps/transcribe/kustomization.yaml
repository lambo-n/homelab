apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A personal mp3-to-text tool, LAN-reachable from any device. It calls out to
# wyoming-whisper on VM 105 -- the same STT backend voice/home-assistant uses --
# over the path already allowed from the three k3s node IPs. Unrelated to the
# voice assistant itself, so kept out of the voice namespace.
resources:
  - namespace.yaml
  - api/ks.yaml
