apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcribe-api
  namespace: transcribe
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcribe-api
  template:
    metadata:
      labels:
        app: transcribe-api
    spec:
      containers:
        - name: transcribe-api
          image: python:3.14-slim@sha256:7bf6c3111fe094f8ee1a1cbcdc63c4cfb345b0e3df42d5aa9a90b3b4b022ab6d
          # No custom image is built for this personal tool -- install ffmpeg
          # and the Python deps at container start on a stock image instead.
          command:
            - sh
            - -c
            - |
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ffmpeg
              pip install --no-cache-dir --quiet fastapi 'uvicorn[standard]' python-multipart wyoming
              exec uvicorn app:app --host 0.0.0.0 --port 8000 --app-dir /app
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: app-code
              mountPath: /app
          # apt+pip on every start, so give it real headroom before probes
          # start killing the pod.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: app-code
          configMap:
            name: transcribe-api
