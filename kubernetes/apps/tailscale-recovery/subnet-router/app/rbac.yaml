---
# tailscaled needs somewhere to persist its node identity. Without this it
# re-registers on every restart, arriving as a NEW tailnet node whose subnet
# route is unapproved -- and route approval is the one step in this recovery
# that needs the admin console. Persisting state in a Secret means a pod
# restart keeps the same node, and the approval sticks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-recovery
rules:
  # `create` cannot be restricted by resourceName -- the object does not exist
  # yet, so there is no name to match on. This is the one unavoidably broad
  # verb here, and it is scoped to this throwaway namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Everything after creation is pinned to the two Secrets this pod may touch:
  # its own state, and the authkey it reads at first login.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - tailscale-subnet-router-state
      - tailscale-authkey
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-subnet-router
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: tailscale-recovery
