---
# TEMPORARY -- a second subnet router for 192.168.50.0/24, standing in for CTID
# 100 while it is stopped.
#
# WHY THIS EXISTS. SAS-RECLAIM.md §3 calls `pct stop 100`. CTID 100 is the only
# tailnet member: it is the exit node, it advertises the only approved
# 192.168.50.0/24 route, and it is the ProxyJump host for every entry in
# ~/.ssh/config -- including `proxmox-host`. Stopping it removes the only path
# to the machine that can start it again. This Deployment restores the subnet
# route from inside the LAN, using the one channel that does not depend on the
# container: Flux polls GitHub outbound every 60s and the k3s VMs were never
# touched.
#
# Once the route is approved and CTID 100 is running, delete this directory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-recovery
spec:
  replicas: 1
  # Recreate, not RollingUpdate. Two tailscaled processes sharing one state
  # Secret is a corruption hazard, and a rolling update deliberately runs both
  # at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      serviceAccountName: tailscale-subnet-router
      # The pod must land on a node that is itself on 192.168.50.0/24. All
      # three k3s VMs are (.104/.105/.106), so no nodeSelector is needed --
      # stated here so the assumption is visible rather than implied.
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: tailscale-subnet-router-state
            - name: TS_ROUTES
              value: "192.168.50.0/24"
            - name: TS_HOSTNAME
              value: k3s-recovery-router
            # MUST stay false. MagicDNS would rewrite this pod's resolv.conf and
            # break in-cluster service resolution for it.
            - name: TS_ACCEPT_DNS
              value: "false"
            # Kernel networking, not userspace. Userspace mode cannot do subnet
            # routing at all -- it proxies to the container and no further --
            # which is why /dev/net/tun and NET_ADMIN below are not optional.
            - name: TS_USERSPACE
              value: "false"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
