apiVersion: v1
kind: Namespace
metadata:
  name: voice
  annotations:
    # Same hazard as the sunfire namespace: the parent flux-system Kustomization
    # runs prune: true and this Namespace sits in its inventory, so dropping it
    # from git would delete it and cascade to the Home Assistant config PVC and
    # the voice-db Cluster. Deleting it stays a manual act.
    kustomize.toolkit.fluxcd.io/prune: disabled
