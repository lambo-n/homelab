# Home Assistant configuration.yaml, mounted read-only from a ConfigMap.
# Edit here, not in HA's UI: the UI cannot write this file.
#
# Keys set here become read-only in the UI (HA shows "configured in YAML").

default_config:

homeassistant:
  time_zone: America/Los_Angeles
  unit_system: us_customary
  # The ServiceLB address the satellite and LAN browsers use. .104 (the control
  # plane) because it is the node that is up whenever the cluster is up at all;
  # ServiceLB answers on every node's address, so .105/.106 work too.
  internal_url: http://192.168.50.104:8123

recorder:
  # postgresql://homeassistant:…@voice-db-rw.voice:5432/homeassistant, from the
  # CNPG-generated voice-db-app Secret via the pod env. Never in this file.
  db_url: !env_var HA_DB_URL
  purge_keep_days: 10
  # Commit every 5 s instead of every 1 s: fewer WAL writes to the zvol, and
  # nothing here needs sub-second history.
  commit_interval: 5

# Push speech to the Doofus satellite without the wake word (2026-09-19). Run
# from the HA app: Settings → Automations & scenes → Scripts, or add them to a
# dashboard. Both speak with the satellite's pipeline voice (norman x0.8).
# Announcements need the satellite's media_player (esphome/voice-satellite.yaml).
script:
  doofus_say:
    alias: Doofus — say this
    icon: mdi:bullhorn
    mode: queued
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.doofus1_assist_satellite
        data:
          message: "{{ message }}"
          preannounce: false

  doofus_ask:
    alias: Doofus — ask the LLM
    icon: mdi:robot-happy
    mode: queued
    fields:
      prompt:
        name: Prompt
        required: true
        selector:
          text:
            multiline: true
    sequence:
      # The same agent and persona as the voice pipeline, answered out loud.
      - action: conversation.process
        data:
          agent_id: conversation.fast
          text: "{{ prompt }}"
        response_variable: reply
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.doofus1_assist_satellite
        data:
          message: "{{ reply.response.speech.plain.speech }}"
          preannounce: false
