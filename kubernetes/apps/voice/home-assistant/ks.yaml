---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 30m
  # First start pulls a ~2 GiB image and installs HA's runtime dependencies.
  timeout: 15m
  path: ./kubernetes/apps/voice/home-assistant/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The config PVC carries prune: disabled; see pvc.yaml.
  prune: true
  wait: true
  dependsOn:
    # The recorder's db_url comes from voice-db-app, which exists only once the
    # Cluster has bootstrapped. Without it the pod sits in CreateContainerConfigError.
    - name: voice-db
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: home-assistant
      namespace: voice
