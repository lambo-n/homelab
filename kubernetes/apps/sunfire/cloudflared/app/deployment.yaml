apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: sunfire
  annotations:
    # Restart this Deployment when a Secret or ConfigMap it references changes.
    # Env vars from secretKeyRef are read once at container start, so without
    # this a rotated Secret reports success and changes nothing.
    # Consumes cloudflared-token. A tunnel-token rotation is exactly the
    # kind of change that looks applied and is not -- the connector keeps its old
    # credential until the pod restarts.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
