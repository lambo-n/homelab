apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: sunfire
  annotations:
    # Restart this Deployment when a Secret or ConfigMap it references changes.
    # Env vars from secretKeyRef are read once at container start, so without
    # this a rotated Secret reports success and changes nothing.
    # Consumes cloudflared-credentials and the cloudflared-config ConfigMap.
    # This one earns its keep twice over: a credential rotation looks applied and
    # is not until the pod restarts, and now that ingress routing lives in a
    # ConfigMap, an ingress edit has exactly the same property.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          # Locally-managed as of 2026-09-04. Previously `run --token $(...)`,
          # which made the connector fetch its entire ingress map from the
          # Cloudflare API -- routing that no manifest here described and no
          # `kubectl diff` could show.
          #
          # The tunnel is `sunfire-local` (1ac59ce2-...), created with
          # config_src: "local" by scripts/cloudflared-new-local-tunnel.sh.
          # A new tunnel was unavoidable: config_src cannot be changed after
          # creation, so the original remotely-managed tunnel could never be
          # converted. See GITOPS.md Phase 6.
          #
          # The old `cloudflared-token` Secret is gone. It held credentials for
          # a tunnel that has since been deleted, so it was not a rollback path
          # any more -- just a live-looking secret for something that no longer
          # exists.
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yaml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            # Deliberately NOT nested under /etc/cloudflared: a Secret mounted
            # inside a ConfigMap's mountpoint is a needless ordering dependency.
            - name: creds
              mountPath: /etc/cloudflared-creds
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
