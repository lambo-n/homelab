apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sunfire
  annotations:
    # Restart this Deployment when a Secret or ConfigMap it references changes.
    # Env vars from secretKeyRef are read once at container start, so without
    # this a rotated Secret reports success and changes nothing.
    # Consumes postgres-credentials. Retained while this Deployment is the
    # rollback path for the CNPG migration; harmless once it is retired. Recreate
    # applies here too, for the reason spelled out below.
    reloader.stakater.com/auto: "true"
spec:
  # SCALED TO ZERO 2026-09-04, as the first reversible step of retiring this
  # Deployment (GITOPS.md Phase 5). Nothing points at it: PostgREST was cut over
  # to postgres-cnpg-rw earlier the same day and the repo contains no other
  # reference to postgres.sunfire.svc.
  #
  # The object and its Service are kept, not deleted, and the PVC is untouched --
  # so rolling back is `replicas: 1` here plus flipping PGRST_DB_URI, and the
  # data is exactly where it was left.
  #
  # ⚠️ One non-obvious consumer remains, and it is not running today. The CNPG
  # Cluster's bootstrap declares this Service as `externalClusters:
  # postgres-legacy` and imports from it. That is read ONCE at cluster creation
  # and never again -- postgres-cnpg is `Initialized`, so it will not reach for
  # this again. But if that Cluster were ever deleted and recreated from git, its
  # bootstrap would try to import from a Deployment scaled to zero and fail.
  # Scale this back to 1 first, or rebuild from the barman backups instead --
  # which is the path that actually has a passing restore drill behind it.
  #
  # ⚠️ The rollback value decays. This data is frozen at the 2026-09-04 cutover;
  # every write CNPG takes since makes rolling back here a data-loss event rather
  # than a recovery. Near-zero today (the new Worker does not exist yet), which is
  # the only reason this is a soft deadline rather than a hard one.
  replicas: 0
  # Recreate, never RollingUpdate: the data directory is a single-writer store on
  # a ReadWriteMany NFS PV (.101:/archive-pool). At replicas: 1 a rolling update's
  # maxUnavailable of 25% rounds down to 0, so Kubernetes starts the new pod
  # before stopping the old one and both mount the same directory at once.
  # That is not theoretical: on 2026-09-02 two postmasters overlapped for ~60s
  # and the second shut itself down with "could not open file postmaster.pid:
  # No such file or directory / data directory lock file is invalid". Postgres's
  # own stale-lock detection cannot save it here — the check is PID-based and the
  # other postmaster is in a different pod on a different node.
  # Converting an *existing* RollingUpdate Deployment needs a one-time patch
  # before this applies — the live object keeps a defaulted rollingUpdate
  # block, server-side apply merges rather than replaces, and the API server
  # rejects the pair. `rollingUpdate: null` here does not clear it either:
  # SSA only drops fields the applying manager owns. Run once per cluster:
  #   kubectl patch deploy -n sunfire <name> --type=merge \
  #     -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  # Done on this cluster 2026-09-03. A fresh install needs none of it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        sunfire/role: postgres
      containers:
        - name: postgres
          image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: sunfire
            - name: POSTGRES_DB
              value: sunfire
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sunfire"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sunfire"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
