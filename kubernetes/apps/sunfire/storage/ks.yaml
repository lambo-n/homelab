---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sunfire-storage
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/sunfire/storage/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  # NEVER enable prune here. These are the NFS-backed PVs/PVCs on
  # archive-pool; a mislabeled prune is the one failure that would hurt.
  prune: false
  wait: true
