apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: sunfire
  annotations:
    # Restart this Deployment when a Secret or ConfigMap it references changes.
    # Env vars from secretKeyRef are read once at container start, so without
    # this a rotated Secret reports success and changes nothing.
    # Consumes postgrest-config (PGRST_DB_URI, SOPS) and
    # sunfire-cross-boundary (PGRST_JWT_SECRET, Infisical) via secretKeyRef. This is the Deployment that proved the point on 2026-09-04:
    # the CNPG cutover changed the Secret, Flux reported Ready, and this pod kept
    # serving from the old database until it was restarted by hand.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.2@sha256:85258123312dc496ad4c2ed832154a65e9746f84df0d6d09b44229ff9230c08e
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgrest-config
                  key: PGRST_DB_URI
            # Cross-boundary: this key must stay byte-identical to what the
            # Cloudflare Worker signs with, so Infisical is system of record and
            # the operator materialises it here. PGRST_DB_URI above stays in
            # SOPS -- it is cluster-only, nothing outside reads it, and keeping
            # it in git is what lets a cold boot come up without app.infisical.com.
            # The split in GITOPS.md "Secrets: hybrid" is these two lines.
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sunfire-cross-boundary
                  key: PGRST_JWT_SECRET
            # Unified 2026-09-02: prod, feature and local dev all share the
            # `public` schema and the `sunfire-guide-media` bucket. Guide media
            # is content, not per-environment state. See GITOPS.md "Unified
            # media store". Applied and verified live 2026-09-03.
            - name: PGRST_DB_SCHEMAS
              value: "public"
            # The hostname cloudflared actually routes to this Service. It is
            # only the `host` field of the OpenAPI document, but a wrong value
            # there points every reader of `/` at a dead zone: sunfirebingo.com
            # belonged to the retired app and is not ours to serve from.
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: https://db.sunosrs.cc
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
