apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: sunfire
spec:
  replicas: 1
  # Recreate, never RollingUpdate: the data directory is a single-writer store on
  # a ReadWriteMany NFS PV (.101:/archive-pool). At replicas: 1 a rolling update's
  # maxUnavailable of 25% rounds down to 0, so Kubernetes starts the new pod
  # before stopping the old one and both mount the same directory at once.
  # Postgres hit exactly this on 2026-09-02 (see its Deployment); MinIO carries
  # the same exposure — two servers writing one backend is unsupported, and its
  # object-level locking assumes it is the only writer.
  # Converting an *existing* RollingUpdate Deployment needs a one-time patch
  # before this applies — the live object keeps a defaulted rollingUpdate
  # block, server-side apply merges rather than replaces, and the API server
  # rejects the pair. `rollingUpdate: null` here does not clear it either:
  # SSA only drops fields the applying manager owns. Run once per cluster:
  #   kubectl patch deploy -n sunfire <name> --type=merge \
  #     -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  # Done on this cluster 2026-09-03. A fresh install needs none of it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        sunfire/role: minio
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
