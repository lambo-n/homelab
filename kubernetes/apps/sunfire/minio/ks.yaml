---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sunfire-minio
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/sunfire/minio/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Enabled 2026-09-03 after clean reconciles at d1a387d. Removing a manifest
  # from git now deletes the live object. Stateful resources are excluded two
  # ways: they live in sunfire-storage (prune permanently false) and carry
  # kustomize.toolkit.fluxcd.io/prune: disabled. See GITOPS.md "Prune safety".
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: sunfire-storage
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: minio
      namespace: sunfire
