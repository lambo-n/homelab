---
# Daily base backup. WAL is archived continuously by the plugin regardless of
# this schedule -- this is what gives those WAL segments a base to replay onto.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: sunfire
spec:
  # CNPG cron is six-field and starts at SECONDS, not minutes. A five-field
  # crontab line pasted here silently runs at the wrong time.
  # 02:30 UTC daily.
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres-cnpg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
