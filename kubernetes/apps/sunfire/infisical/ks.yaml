---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sunfire-infisical
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/sunfire/infisical/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  # wait: false deliberately. The only resource here that can report readiness
  # is the InfisicalSecret, and its Ready condition depends on app.infisical.com
  # being reachable. With wait: true an Infisical outage would leave this
  # Kustomization permanently un-Ready, and anything that dependsOn it would
  # stop reconciling -- turning a stale-secret problem into a stopped-GitOps
  # problem.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    # The CRD this applies is installed by the operator's chart. Without this
    # the first reconcile of a fresh cluster fails on an unknown kind.
    - name: infisical-secrets-operator
