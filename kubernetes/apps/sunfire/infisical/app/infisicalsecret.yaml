---
# Materialises the ONE cross-boundary secret this cluster consumes: the JWT
# signing key PostgREST validates tokens with, which the Cloudflare Worker signs
# them with. Same bytes, two names -- the Worker calls it POSTGREST_JWT_SECRET,
# PostgREST wants PGRST_JWT_SECRET.
#
# WHY A TEMPLATE RATHER THAN A STRAIGHT COPY. secretsScope fetches a PATH, not a
# key, so the natural result would drop all three prod secrets into the cluster
# -- including MINIO_ACCESS_KEY and MINIO_SECRET_KEY, which are the Worker's
# credentials and which no workload here consumes. Materialising those would
# recreate `minio-worker-credentials`, the "filing cabinet" Secret that Phase 2b
# exists partly to delete. `includeAllSecrets: false` plus an explicit one-key
# template means the cluster holds exactly what it uses, and the rename comes
# free in the same expression.
#
# creationPolicy is Orphan (the chart default, stated here because it matters):
# the managed Secret carries no ownerReference back to this CR, so deleting or
# renaming this resource does not garbage-collect the live secret out from under
# a running PostgREST.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: sunfire-cross-boundary
  namespace: sunfire
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    # 5 minutes. These values rotate deliberately and rarely, so a faster poll
    # buys nothing and spends free-tier API calls. `instantUpdates` is the
    # event-driven alternative and is Enterprise-only.
    resyncInterval: 300s
  authentication:
    universalAuth:
      secretsScope:
        # projectId, not projectSlug -- the CRD accepts either, and the id is
        # stable across a project rename. Only envSlug and secretsPath are
        # required by the schema.
        projectId: a47fcb88-5044-463e-a7c6-7119b4f3c89e
        # The SLUG, not the display name. Renaming the environment in Project
        # Settings changes the display name only; the CLI and this operator key
        # off the slug, which is the silent trap recorded in GITOPS.md Phase 2b.
        envSlug: prod
        secretsPath: /
        recursive: false
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: sunfire
  managedKubeSecretReferences:
    - secretName: sunfire-cross-boundary
      secretNamespace: sunfire
      creationPolicy: Orphan
      template:
        includeAllSecrets: false
        data:
          PGRST_JWT_SECRET: "{{ .POSTGREST_JWT_SECRET.Value }}"
