---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-canary
  namespace: flux-system
spec:
  # 30m matches every other app here, but reconciliation is not what this proves
  # -- the GitRepository poll is. A push to main lands within the sync interval;
  # `flux reconcile source git flux-system` forces it immediately.
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/gitops-canary/canary/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  # prune: true so removing this directory from git deletes the Deployment, and
  # the parent flux-system Kustomization then prunes the Namespace with it.
  prune: true
  wait: true
  # No dependsOn, and nothing depends on this: like reloader, it is kept out of
  # the sunfire and cnpg graphs so it cannot wedge them. No decryption block --
  # this app has no secrets.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: canary
      namespace: gitops-canary
