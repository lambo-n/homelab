apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: gitops-canary
  labels:
    app: canary
  annotations:
    # TEMPORARY. This exists only to verify that a push to main is reconciled
    # onto the cluster. It runs the kubelet's own pause image -- no listeners,
    # no volumes, no secrets, ~300 KiB pulled, and disk is the scarce resource
    # here. Delete kubernetes/apps/gitops-canary/ and its line in
    # kubernetes/flux/cluster/kustomization.yaml to remove it; prune does the rest.
    homelab/purpose: gitops-reconciliation-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
